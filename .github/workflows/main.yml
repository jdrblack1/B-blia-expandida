name: Compilar APK Biblia Expandida

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependencias
        run: npm install --legacy-peer-deps

      - name: Criar Ponto de Entrada
        run: |
          cat << 'EOF' > index.js
          import { registerRootComponent } from 'expo';
          import App from './App';

          registerRootComponent(App);
          EOF

      - name: Criar Projeto Android Nativo
        run: npx expo prebuild --platform android --no-install

      - name: Embutir Codigo Offline no APK
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Compilar APK Release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Disponibilizar APK para Baixar
        uses: actions/upload-artifact@v4
        with:
          name: Biblia-Expandida-Instalador
          path: android/app/build/outputs/apk/release/*.apk
